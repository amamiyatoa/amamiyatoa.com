<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="static/js/index.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <title>雨宮とあの開発所</title>
</head>
<body>

    <div class="container">

        <header class="header">

            <div class="image">
                <img src="assets/logo.png" alt="site logo">
            </div>

            <div class="menu">
                <ul class="menu">
                    <li class="menuItem">
                        <a href="#" id="menuLinkBox">Home</a>
                    </li>
                    <li class="menuItem">
                        <a href="#" id="menuLinkBox">Contact</a>
                    </li>
                    <li id="menuListBox" class="menuItem">
                        <a href="#" id="menuLinkBox">Wish List</a>
                        <ul id="detailMenuItem" class="invisibleLink">
                            <li class="detailMenuItems">Booth</li>
                            <li class="detailMenuItems">Amazon</li>
                        </ul>
                    </li>
                </ul>
            </div>
        </header>

        <div class="content">
            <main>
                <div id="articleWrapper">
                    <article class="myIntroduce">
                        <section class="topIntro">
                            <h1 class="myProfileHeader"><span class="profileHeader">Profile</span></h1>
                            <div class="profiles">
                                <img src="assets/myIcon.png" alt="my icon">
                                <div class="introProfile">
                                    <h3 class="name">Name: "雨宮とあ"</h3>
                                    <p class="intro">ご閲覧ありがとうございます！<br>
                                        普段はVRChatで活動をしている<span class="nameHighlight">雨宮とあ</span>と申します！<br><br>
                                        <span class="highWeightStyle">&lt;Hobby&gt;</span><br>
                                        <span class="hobbyStyle">
                                            ・ゲーム<br>
                                            ・自作PC関連<br>
                                            ・プログラミング<br>
                                            ・サーバー運用<br>
                                            ・アニメ・EDM<br><br>
                                        </span>
                                    </p>
                                    <p class="useLang">
                                        <span class="highWeightStyle">&lt;Using Language&gt;</span><br>
                                    </p>
                                    <span class="weightStyle">
                                        <ul>
                                            <li>・HTML5,CSS</li>
                                            <li>・JavaScript</li>
                                            <li>・Java</li>
                                            <li>・Rust(勉強中)</li>
                                        </ul>
                                    </span>
                                </div>
                            </div>
                        </section>
                    </article>
                    
                    <article class="mainArticle">
                        <section class="sectSetting">
                            <h1 class="title"><span class="titlePad">About Me</span></h1>
                            <div class="sectMainContent">
                                <h3 class="miniTitle">あなたはだーれ？</h3>
                            </div>
                        </section>
                    </article>
                </div>
            </main>
        </div>

    </div>
    
</body>
</html>
